# Full comparison run. This is the config behind docs/RESULTS.md.
#
# 200 subjects x 60 s at 125 Hz with an 8 s window and 4 s stride gives ~2,700 windows.
# On this machine (6-thread CPU, no GPU) the three models together take roughly 25-35
# minutes including the robustness sweep. Raising n_subjects is the first thing to try if
# the results look noisy; raising epochs rarely helps once early stopping is triggering.
name: experiment
model_kind: pinn
out_dir: reports

data:
  dataset: synthetic
  n_subjects: 200
  duration_s: 60.0
  fs: 125.0
  window_s: 8.0
  stride_s: 4.0
  hypertensive_fraction: 0.35
  # Train with mild corruption present. Training entirely on clean signals produces a model
  # that collapses the moment the wrist moves; this is the cheapest form of robustness and
  # the baselines get exactly the same treatment, so the comparison stays fair.
  train_artifact_severity: 0.25
  train_artifact_prob: 0.5
  split: subject
  ratios: [0.6, 0.2, 0.2]
  seed: 0
  cache_dir: data/cache

model:
  widths: [32, 48, 64, 96]
  latent_dim: 128
  n_harmonics: 8
  field_hidden: 128
  basis: harmonic
  n_dense: 128
  dropout: 0.10

train:
  epochs: 60
  batch_size: 64
  lr: 0.002
  weight_decay: 0.0001
  grad_clip: 1.0
  warmup_epochs: 5
  n_collocation: 64
  patience: 15
  seed: 0
  num_workers: 0
  w_data: 1.0
  w_ode: 0.10
  w_periodicity: 0.05
  w_tau: 0.05
  w_map: 0.02
  w_prior: 0.10
  physics_warmup_epochs: 10
